# Directory-level format override for the slides deliverable (revealjs).
# Inherits execute/knitr/bibliography from ../_quarto.yml. Not a project/here() root marker.
format:
  revealjs:
    theme: simple
    slide-number: true
    incremental: false
    fig-format: svg
    fig-width: 6
    fig-height: 3.5
    code-line-numbers: true
